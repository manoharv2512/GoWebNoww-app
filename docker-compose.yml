services:
  postgres:
    image: postgres:16-alpine
    container_name: gowebnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gowebnow
      POSTGRES_USER: gowebnow
      POSTGRES_PASSWORD: gowebnow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gowebnow -d gowebnow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
